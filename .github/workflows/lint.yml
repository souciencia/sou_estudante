name: Check Code Formatting

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  check-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Check TypeScript / CSS format (Biome)
        working-directory: packages/front
        run: npx @biomejs/biome ci .

      - name: Check Go format (gofmt)
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Os seguintes arquivos em Go não estão formatados:"
            gofmt -l .
            exit 1
          fi