name: sou_estudante

services:
  se_es01:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: ${ESNODE01_NAME:-se_es01}
    environment:
      - node.name=${ESNODE01_NAME:-se_es01}
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - xpack.security.enabled=true
      - ELASTICSEARCH_USERNAME=${ELASTICSEARCH_USERNAME}
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms1g -Xmx1g}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elsou-data:/usr/share/elasticsearch/data
    networks:
      - data_net
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u ${ELASTICSEARCH_USERNAME}:${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health | grep -vq '\"status\":\"red\"'"]
      interval: 20s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  se_api:
    build:
      context: ./packages/api
      dockerfile: Dockerfile
    image: sou_estudante/api:${IMAGE_TAG:-latest}
    container_name: se_api
    environment:
      - ES_URL=${ELASTICSEARCH_URL}
      - ES_APIKEY=${ELASTICSEARCH_APIKEY}
      - CURSOS_INDEX_NAME=${CURSOS_INDEX_NAME}
      - IES_INDEX_NAME=${IES_INDEX_NAME}
      - CURSOS_DICT_INDEX_NAME=${CURSOS_DICT_INDEX_NAME}
      - IES_DICT_INDEX_NAME=${IES_DICT_INDEX_NAME}
      - PORT=8080
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - web_net
      - data_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      se_es01:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  se_front:
    build:
      context: ./packages/front
      dockerfile: Dockerfile
      args:
        API_URL: ${API_URL:-http://se_api:8080}
    image: sou_estudante/front:${IMAGE_TAG:-latest}
    container_name: se_front
    environment:
      - API_URL=${API_URL:-http://se_api:8080}
    ports:
      - "3000:3000"
    networks:
      - web_net
    depends_on:
      se_api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  se_bulk:
    build:
      context: ./packages/api
      dockerfile: Dockerfile.seed
    image: sou_estudante/seed:${IMAGE_TAG:-latest}
    container_name: se_bulk
    environment:
      - ES_URL=${ELASTICSEARCH_URL}
      - ES_INGEST_APIKEY=${ELASTICSEARCH_BULK_APIKEY}
      - CURSOS_INDEX_NAME=${CURSOS_INDEX_NAME}
      - CURSOS_DICT_INDEX_NAME=${CURSOS_DICT_INDEX_NAME}
      - CURSOS_JSON_FILE_PATH=${CURSOS_JSON_FILE_PATH}
      - IES_INDEX_NAME=${IES_INDEX_NAME}
      - IES_JSON_FILE_PATH=${IES_JSON_FILE_PATH}
      - IES_DICT_INDEX_NAME=${IES_DICT_INDEX_NAME}
    volumes:
      - ./data:/data:ro
    networks:
      - data_net
    depends_on:
      se_es01:
        condition: service_healthy
    profiles: ["bulk"]

volumes:
  elsou-data:
    driver: local

networks:
  web_net:
    name: web_net
    driver: bridge
  data_net:
    name: data_net
    driver: bridge
